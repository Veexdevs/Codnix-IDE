name: Android — APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['desktop/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependências
        run: npm ci

      - name: Instalar Capacitor
        run: npm i -D @capacitor/cli@6 @capacitor/core@6 @capacitor/android@6

      - name: Preparar plataforma Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Gradle — APK debug
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - name: Gradle — APK release (não assinado)
        run: |
          cd android && ./gradlew assembleRelease || true

      - name: Preparar artefatos
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/CODNIX-IDE-debug.apk 2>/dev/null || true
          if [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk out/CODNIX-IDE-release-unsigned.apk
          elif [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/CODNIX-IDE-release-unsigned.apk
          fi
          ls -la out

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: codnix-android-apk
          path: out/*.apk
          if-no-files-found: error

# Observacoes:
# - O APK release sai "unsigned" (nao assinado). Para publicar na Play Store, adicione
#   assinatura com keystore via Secrets do GitHub (KEYSTORE_BASE64, KEYSTORE_PASSWORD,
#   KEY_ALIAS, KEY_PASSWORD) e um passo de assinatura com apksigner.
# - O app carrega o CODNIX IDE publicado (capacitor.config.json -> server.url).
